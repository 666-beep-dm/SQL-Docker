services:
  # ---------------------------------------------------------- #
  # PostgreSQL database                                         #
  # ---------------------------------------------------------- #
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: production_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------- #
  # FastAPI application                                         #
  # ---------------------------------------------------------- #
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Production Backend App"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      SECRET_KEY: "change-me-in-production-use-a-long-random-string!!"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: production_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8000:8000"
    volumes:
      # Mount source for local development hot-reload (remove in prod)
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
    driver: local
